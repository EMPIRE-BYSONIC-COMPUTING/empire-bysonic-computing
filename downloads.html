<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Download software made available by Empire Bysonic Computing.">
    <title>Software Downloads | Empire Bysonic Computing</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .download-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 12px 24px;
            border-radius: 10px;
            background: #ffbf00;
            color: #111;
            text-decoration: none;
            font-weight: 800;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .download-button:hover {
            background: #ffd34d;
            transform: translateY(-1px);
        }
        .download-button:focus-visible {
            outline: 3px solid #111;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <header class="amber-color">
        <h1>Software Downloads</h1>
    </header>
    <main class="service-page">
        <section class="beig-color">
            <h2>Available Downloads</h2>
            <p>Files listed here are provided for visitors to download.</p>
        </section>
        <section aria-label="Available software downloads">
            <p id="downloads-status" role="status" aria-live="polite">Loading available downloads…</p>
            <div id="downloads-list" style="display:grid;gap:16px;"></div>
        </section>
        <p><a class="service-button" href="index.html">Back to homepage</a></p>
    </main>
    <script>
        (function () {
            const repository = "EMPIRE-BYSONIC-COMPUTING/empire-bysonic-computing";
            const status = document.getElementById("downloads-status");
            const list = document.getElementById("downloads-list");

            function formatSize(bytes) {
                if (bytes < 1024) return bytes + " B";
                const units = ["KB", "MB", "GB"];
                let size = bytes / 1024;
                let unit = 0;
                while (size >= 1024 && unit < units.length - 1) {
                    size /= 1024;
                    unit += 1;
                }
                return size.toFixed(1) + " " + units[unit];
            }

            fetch("https://api.github.com/repos/" + repository + "/contents/downloads?per_page=100")
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("GitHub returned HTTP " + response.status);
                    }
                    return response.json();
                })
                .then(function (files) {
                    const downloadableFiles = files.filter(function (file) {
                        return file.type === "file" &&
                            !file.name.startsWith(".") &&
                            file.name.toLowerCase() !== "readme.md";
                    });

                    if (downloadableFiles.length === 0) {
                        status.textContent = "No downloads are currently available.";
                        return;
                    }

                    downloadableFiles.forEach(function (file) {
                        const article = document.createElement("article");
                        article.className = "beig-color";

                        const title = document.createElement("h2");
                        title.textContent = file.name;

                        const details = document.createElement("p");
                        details.textContent = formatSize(file.size);

                        const link = document.createElement("a");
                        link.className = "download-button";
                        link.href = "downloads/" + encodeURIComponent(file.name);
                        link.setAttribute("download", file.name);
                        link.textContent = "Download";
                        link.setAttribute("aria-label", "Download " + file.name);

                        article.append(title, details, link);
                        list.appendChild(article);
                    });

                    status.textContent = "";
                })
                .catch(function (error) {
                    console.error("Could not load the downloads folder:", error);
                    status.textContent = "Downloads could not be loaded right now. Please try again later.";
                });
        })();
    </script>
</body>
</html>
