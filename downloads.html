<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Download software made available by Empire Bysonic Computing.">
    <title>Software Downloads | Empire Bysonic Computing</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .download-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 12px 24px;
            border-radius: 10px;
            background: #ffbf00;
            color: #111;
            text-decoration: none;
            font-weight: 800;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .download-button:hover {
            background: #ffd34d;
            transform: translateY(-1px);
        }
        .download-button:focus-visible {
            outline: 3px solid #111;
            outline-offset: 3px;
        }
        .download-category-heading {
            grid-column: 1 / -1;
            margin: 8px 0 0;
            color: #ffbf00;
        }
        .download-page-card {
            padding: 20px;
            border-radius: 12px;
            background: beige;
            color: #333;
        }
        .download-page-card h2,
        .download-page-card p {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <header class="amber-color">
        <h1>Software Downloads</h1>
    </header>
    <main class="service-page">
        <section class="beig-color">
            <h2>Available Downloads</h2>
            <p>Files listed here are provided for visitors to download.</p>
        </section>
        <section aria-label="Available software downloads">
            <p id="downloads-status" role="status" aria-live="polite">Loading available downloads…</p>
            <div id="downloads-list" style="display:grid;gap:16px;"></div>
        </section>
        <p><a class="service-button" href="index.html">Back to homepage</a></p>
    </main>
    <script src="downloads.js" defer></script>
</body>
</html>
