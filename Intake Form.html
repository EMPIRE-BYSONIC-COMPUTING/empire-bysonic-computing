<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Repair Intake Form</title>
    <!-- Connects to your central stylesheet tab -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="repair-form-container">
        <h2>💻 Computer Repair Intake Form</h2>
        <p>Please fill out the details below to check in your device.</p>
        
        <form action="#" method="POST">
            <!-- Customer Info -->
            <fieldset>
                <legend>Customer Information</legend>
                <div class="form-group">
                    <label for="client-name">Full Name *</label>
                    <input type="text" id="client-name" name="client_name" required placeholder="John Doe">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="client-phone">Phone Number *</label>
                        <input type="tel" id="client-phone" name="client_phone" required placeholder="(123) 456-7890">
                    </div>
                    <div class="form-group">
                        <label for="client-email">Email Address *</label>
                        <input type="email" id="client-email" name="client_email" required placeholder="john@example.com">
                    </div>
                </div>
            </fieldset>

            <!-- Device Info -->
            <fieldset>
                <legend>Device Details</legend>
                <div class="form-row">
                    <div class="form-group">
                        <label for="device-type">Device Type *</label>
                        <select id="device-type" name="device_type" required>
                            <option value="" disabled selected>Select device type</option>
                            <option value="desktop">Desktop PC</option>
                            <option value="laptop">Laptop</option>
                            <option value="macbook">MacBook / iMac</option>
                            <option value="gaming">Gaming Console / Custom PC</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="device-brand">Brand & Model *</label>
                        <input type="text" id="device-brand" name="device_brand" required placeholder="e.g., Dell XPS 15, HP Pavilion">
                    </div>
                </div>
                <div class="form-group">
                    <label for="device-serial">Serial Number (Optional)</label>
                    <input type="text" id="device-serial" name="device_serial" placeholder="Look on the bottom or back of device">
                </div>
                <div class="form-group">
                    <label>Backup Status *</label>
                    <div class="radio-group">
                        <label><input type="radio" name="data_backup" value="yes" required> My data is backed up</label>
                        <label><input type="radio" name="data_backup" value="no"> Data is NOT backed up (Need backup service)</label>
                        <label><input type="radio" name="data_backup" value="na"> No important data on device</label>
                    </div>
                </div>
            </fieldset>

            <!-- Issue Description -->
            <fieldset>
                <legend>Problem Description</legend>
                <div class="form-group">
                    <label for="issue-desc">What issues are you experiencing? *</label>
                    <textarea id="issue-desc" name="issue_description" rows="4" required placeholder="Please describe the symptoms (e.g., won't turn on, blue screen, liquid damage, running slow)..."></textarea>
                </div>
                <div class="form-group">
                    <label for="passcode">Device Password / PIN (Optional)</label>
                    <input type="text" id="device-password" name="device_password" placeholder="Required for testing repairs">
                    <small class="form-hint">Leave blank if you prefer to log in yourself during pickup.</small>
                </div>
            </fieldset>

            <button type="submit" class="submit-btn">Submit Repair Request</button>
        </form>
    </div>

    <!-- FIXED: Elements placed properly inside the body container tags -->
    <footer>
        <p class="copyright-text">
            <i>&copy; 2026 EMPIRE BYSONIC COMPUTING</i>
        </p>
    </footer>

</body>
</html>
